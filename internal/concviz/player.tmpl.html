<!doctype html>
<!-- Generated by internal/concviz (go test ./internal/concviz -update); do not edit. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goroutines and channels, step by step</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--ln:#d1d9e0;--panel:#f6f8fa;--cur:#ddf4ff;--acc:#0969da}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--ln:#3d444d;--panel:#151b23;--cur:#0c2d6b;--acc:#4493f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--ln)}
h1{font-size:16px;margin:0 12px 0 0}
button,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--ln);border-radius:6px;padding:4px 10px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:16px 20px}
@media (max-width:1150px){main{grid-template-columns:1fr}}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}
#scrub{flex:1;min-width:160px}
#clock{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);min-width:90px;text-align:right}
.hint{color:var(--mut);font-size:12px;margin:4px 0}
aside{display:flex;flex-direction:column;min-height:0;max-height:70vh}
@media (min-width:1151px){aside{position:sticky;top:16px;align-self:start;max-height:calc(100vh - var(--head,55px) - 35px)}}
aside h2{font-size:14px;margin:0 0 6px}
ol{margin:0;padding-left:30px;overflow-y:auto;min-height:0}
li{padding:5px 8px;border-radius:6px;cursor:pointer}
li.cur{background:var(--cur)}
li .ops{display:none;margin:6px 0 2px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);white-space:pre-wrap}
li.cur .ops{display:block}
</style>
</head>
<body>
<header><h1>Goroutines and channels, step by step</h1><span id="tabs"></span></header>
<main>
<section>
<div id="scene"></div>
<div class="controls">
<button id="prev" title="Previous step (←)">◀ Step</button>
<button id="play" title="Play or pause (Space)">▶ Play</button>
<button id="next" title="Next step (→)">Step ▶</button>
<input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Time">
<span id="clock"></span>
<select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
</div>
<p class="hint">← → step · Space play or pause · click a step to jump to it. The scene shows one possible run; the scheduler may choose another.</p>
</section>
<aside><h2 id="where"></h2><ol id="steps"></ol></aside>
</main>
<script id="data" type="application/json">/*DATA*/</script>
<script>
"use strict";
const stories = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const root = $("scene").attachShadow({ mode: "open" });
let story, anims = [], playing = false, stopAt = null, raf = 0;

const now = () => (anims.length ? (anims[0].currentTime || 0) / 1000 : 0);
const stepAt = (t) => {
  let i = 0;
  while (i + 1 < story.steps.length && story.steps[i + 1].t0 <= t + 1e-6) i++;
  return i;
};
// The moment step i has played out: values arrived, states changed. The
// last step plays out at the end of the timeline.
const settled = (i) => {
  if (i + 1 >= story.steps.length) return story.total;
  return Math.min(story.steps[i].t1 + 0.4, story.steps[i + 1].t0 - 0.01);
};

function seek(t) {
  t = Math.max(0, Math.min(t, story.total - 0.001));
  for (const a of anims) a.currentTime = t * 1000;
  show();
}
function pause() {
  for (const a of anims) a.pause();
  playing = false;
  stopAt = null;
  show();
}
function play(until) {
  if (until == null && now() >= story.total - 0.05) seek(0);
  for (const a of anims) a.play();
  playing = true;
  stopAt = until ?? null;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(function tick() {
    if (!playing) return;
    if (stopAt != null && now() >= stopAt) {
      seek(stopAt);
      pause();
      return;
    }
    if (now() >= story.total) {
      seek(story.total - 0.001);
      pause();
      return;
    }
    show();
    raf = requestAnimationFrame(tick);
  });
}
// Plays step i from its start until it has played out.
function playStep(i) {
  seek(story.steps[i].t0);
  play(settled(i));
}
function next() {
  const i = stepAt(now());
  if (!playing && now() < settled(i) - 0.05) return playStep(i);
  if (i + 1 < story.steps.length) playStep(i + 1);
}
function prev() {
  pause();
  const i = stepAt(now());
  seek(settled(Math.max(0, now() > settled(i) + 0.05 ? i : i - 1)));
}

// reveal scrolls the step list, and only the list, so that li is in view.
function reveal(li) {
  const ol = $("steps"), b = ol.getBoundingClientRect(), r = li.getBoundingClientRect();
  if (r.top < b.top) ol.scrollTop -= b.top - r.top;
  else if (r.bottom > b.bottom) ol.scrollTop += Math.min(r.bottom - b.bottom, r.top - b.top);
}

let shown = -1;
function show() {
  const t = now();
  $("scrub").value = Math.round((t / story.total) * 1000);
  $("clock").textContent = `${t.toFixed(1)} / ${story.total.toFixed(1)} s`;
  $("play").textContent = playing ? "❚❚ Pause" : "▶ Play";
  const i = stepAt(t);
  if (i !== shown) {
    shown = i;
    [...$("steps").children].forEach((li, k) => {
      li.classList.toggle("cur", k === i);
      if (k === i) reveal(li);
    });
    $("where").textContent = `Step ${i + 1} of ${story.steps.length}`;
  }
}

function load(id) {
  if (story) pause();
  story = stories.find((s) => s.id === id) || stories[0];
  // Page styles do not reach into the shadow root: the scene gets its own.
  // As wide as the column, as high as the window allows with the controls
  // still in view; the drawing is centred in whatever remains.
  root.innerHTML = "<style>svg{display:block;width:100%;height:auto;max-height:calc(100vh - var(--head,55px) - 115px)}</style>" + story.svg;
  anims = root.getAnimations();
  for (const a of anims) {
    a.pause();
    a.playbackRate = +$("speed").value;
  }
  const ol = $("steps");
  ol.textContent = "";
  story.steps.forEach((st, k) => {
    const li = document.createElement("li");
    li.textContent = st.caption;
    const ops = document.createElement("div");
    ops.className = "ops";
    ops.textContent = st.ops.join("\n");
    li.append(ops);
    li.onclick = () => playStep(k);
    ol.append(li);
  });
  for (const b of $("tabs").children) b.setAttribute("aria-pressed", b.dataset.id === story.id);
  document.title = story.title;
  shown = -1;
  seek(0);
}

for (const s of stories) {
  const b = document.createElement("button");
  b.textContent = s.title.replace(/:.*/, "");
  b.title = s.title;
  b.dataset.id = s.id;
  b.onclick = () => (location.hash = s.id);
  $("tabs").append(b, " ");
}
$("play").onclick = () => (playing ? pause() : play());
$("next").onclick = next;
$("prev").onclick = prev;
$("scrub").oninput = (e) => {
  pause();
  seek((e.target.value / 1000) * story.total);
};
$("speed").onchange = (e) => {
  for (const a of anims) a.playbackRate = +e.target.value;
};
addEventListener("keydown", (e) => {
  if (e.target.closest("input,select") || (e.key === " " && e.target.closest("button"))) return;
  if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === " ") playing ? pause() : play();
  else return;
  e.preventDefault();
});
addEventListener("hashchange", () => load(location.hash.slice(1)));
// The header's height (the tabs may wrap) sets how high scene and list may be.
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--head", e.target.offsetHeight + "px"))
  .observe(document.querySelector("header"));
load(location.hash.slice(1));
</script>
</body>
</html>
