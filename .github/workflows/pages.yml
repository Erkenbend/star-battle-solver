name: Pages

# Publishes the step-through player of architecture/concurrency.md
# (architecture/concurrency/player.html, generated by internal/concviz and
# checked by CI) on GitHub Pages, so the links in concurrency.md open it.
# Only the player goes on the site, as index.html and player.html.
# Needs Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: [architecture/concurrency/player.html]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy player
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Site
        run: |
          set -euo pipefail
          mkdir site
          cp architecture/concurrency/player.html site/player.html
          cp architecture/concurrency/player.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
