name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-26.04
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Node für internal/web/logic_test.js (TestJSLogic), im Runner-Image vorinstalliert.
      - run: node --version
      - name: go vet
        run: go vet ./...
      # Every hard puzzle of the library, not just the sample in
      # testdata/hard/sample.idx. About 6 min locally and longer on the
      # runner, hence more than the default 10 min timeout per package.
      # -coverpkg=./... also counts code that is exercised by other packages'
      # tests (e.g. internal/puzzle has no tests of its own).
      - name: go test (all hard puzzles)
        env:
          STARBATTLE_ALL_HARD: "1"
        run: go test -timeout 45m -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage
        id: coverage
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $NF); print $NF }')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "### Coverage: $total %" >> "$GITHUB_STEP_SUMMARY"
      - name: go test -race
        run: go test -race -short ./...

  # Stores the badge data as shields.io endpoint JSON on the orphan branch
  # "badges" (history overwritten each time): coverage.json and library.json
  # (number of puzzles in the library). The README badges read them from
  # there. No external service or token needed.
  badges:
    name: Badges
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Push badge data to branch badges
        env:
          TOTAL: ${{ needs.test.outputs.coverage }}
        run: |
          set -euo pipefail
          color=$(awk -v t="$TOTAL" 'BEGIN {
            if (t >= 90) print "brightgreen"; else if (t >= 80) print "green";
            else if (t >= 70) print "yellowgreen"; else if (t >= 60) print "yellow";
            else print "red" }')
          # Same rule as starbattle.ReadIndex: '#' starts a comment, blank lines are skipped.
          puzzles=$(awk '{ sub(/#.*/, "") } NF { n++ } END { print n + 0 }' testdata/hard/bibliothek.idx)
          git checkout --orphan badges
          git rm -rfq .
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$TOTAL" "$color" > coverage.json
          printf '{"schemaVersion":1,"label":"Bibliothek","message":"%s Puzzles","color":"blueviolet"}\n' "$puzzles" > library.json
          git add coverage.json library.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Coverage $TOTAL%, $puzzles puzzles (${GITHUB_SHA::7})"
          git push -f origin badges

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - { name: linux-amd64, goos: linux, goarch: amd64 }
          - { name: linux-arm64, goos: linux, goarch: arm64 } # Raspberry Pi 3/4/5 mit 64-Bit-OS
          - { name: linux-armv7, goos: linux, goarch: arm, goarm: "7" } # Raspberry Pi 2/3/4 mit 32-Bit-OS
          - { name: macos-arm64, goos: darwin, goarch: arm64 }
          - { name: windows-amd64, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-Compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          exe=starbattle; [[ $GOOS == windows ]] && exe=starbattle.exe
          dir=starbattle-${{ matrix.name }}
          mkdir -p "$dir" dist
          go build -trimpath -ldflags="-s -w" -o "$dir/$exe" ./cmd/starbattle
          cp README.md LICENSE "$dir/"
          mkdir -p "$dir/docs" && cp docs/*.md "$dir/docs/"
          # Genau eine Datei pro Plattform; sie wird ohne zusätzliches zip
          # hochgeladen (archive: false). tar.gz behält das Ausführbar-Bit.
          if [[ $GOOS == windows ]]; then
            zip -qr "dist/$dir.zip" "$dir"
          else
            tar -czf "dist/$dir.tar.gz" "$dir"
          fi
          ls -l dist
      # Mit archive: false heißt das Artefakt wie die Datei, z. B.
      # starbattle-linux-arm64.tar.gz.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
          archive: false
          if-no-files-found: error
