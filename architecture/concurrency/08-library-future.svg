<g class="v" style="animation-name:k14"><rect class="g run" x="377" y="74" width="226" height="72" rx="8"/><text class="gn" x="490" y="93">solver</text><text class="gf m" x="490" y="108">web.Library.start</text><text class="gs m s-run" x="490" y="125">bruteforce, then solve</text></g>
<g class="v" style="animation-name:k15"><text class="m" x="73" y="121">done</text></g>
<g class="v" style="animation-name:k18"><rect class="g blk" x="257" y="364" width="226" height="72" rx="8"/><text class="gn" x="370" y="383">/weg, visitor 1</text><text class="gf m" x="370" y="398">web.libraryRoutes</text><text class="gs m s-blk" x="370" y="415">blocked in select:</text><text class="gs m s-blk" x="370" y="428">&lt;-e.ready | &lt;-r.Context().Done()</text></g>
<g class="v" style="animation-name:k21"><rect class="g blk" x="497" y="364" width="226" height="72" rx="8"/><text class="gn" x="610" y="383">/weg, visitor 2</text><text class="gf m" x="610" y="398">web.libraryRoutes</text><text class="gs m s-blk" x="610" y="415">blocked in select:</text><text class="gs m s-blk" x="610" y="428">&lt;-e.ready | &lt;-r.Context().Done()</text></g>
<g class="v" style="animation-name:k22"><rect class="g ext" x="257" y="364" width="226" height="72" rx="8"/><text class="gn" x="370" y="383">/weg, visitor 1</text><text class="gf m" x="370" y="398">web.libraryRoutes</text><text class="gs m s-ext" x="370" y="415">returned: visitor left</text></g>
<g class="v" style="animation-name:k23"><rect class="cx" x="322" y="528" width="96" height="34" rx="6"/><text class="ct" x="370" y="550">closed</text></g>
<g class="v" style="animation-name:k24"><rect class="g run" x="497" y="364" width="226" height="72" rx="8"/><text class="gn" x="610" y="383">/weg, visitor 2</text><text class="gf m" x="610" y="398">web.libraryRoutes</text><text class="gs m s-run" x="610" y="415">e.ready closed</text></g>
<g class="v" style="animation-name:k25"><rect class="g ext" x="377" y="74" width="226" height="72" rx="8"/><text class="gn" x="490" y="93">solver</text><text class="gf m" x="490" y="108">web.Library.start</text><text class="gs m s-ext" x="490" y="125">returned</text></g>
<g class="v" style="animation-name:k26"><rect class="cx" x="442" y="238" width="96" height="34" rx="6"/><text class="ct" x="490" y="260">closed</text></g>
<g class="v" style="animation-name:k27"><text class="m" x="733" y="121">set</text></g>
<g class="v" style="animation-name:k28"><rect class="g ext" x="497" y="364" width="226" height="72" rx="8"/><text class="gn" x="610" y="383">/weg, visitor 2</text><text class="gf m" x="610" y="398">web.libraryRoutes</text><text class="gs m s-ext" x="610" y="415">returned</text></g>
<g class="v" style="animation-name:k29"><rect class="g ext" x="737" y="364" width="226" height="72" rx="8"/><text class="gn" x="850" y="383">page, visitor 3</text><text class="gf m" x="850" y="398">web.libraryRoutes</text><text class="gs m s-ext" x="850" y="415">page sent with trace</text></g>
<g class="t" style="animation-name:k38"><rect class="tk" x="-26.8" y="-10" width="53.6" height="20" rx="10"/><text class="tl m" y="4">closed</text></g>
<g class="t" style="animation-name:k39"><rect class="tk" x="-26.8" y="-10" width="53.6" height="20" rx="10"/><text class="tl m" y="4">closed</text></g>
<g class="t" style="animation-name:k40"><rect class="tk" x="-26.8" y="-10" width="53.6" height="20" rx="10"/><text class="tl m" y="4">closed</text></g>
<g class="v" style="animation-name:k30"><text class="cn2" x="20" y="634">1/8</text><text class="cp" x="64" y="634">Visitor 1 opens a library puzzle. Building the page, done() peeks at e.ready with a select with default: it never blocks.</text></g>
<g class="v" style="animation-name:k31"><text class="cn2" x="20" y="634">2/8</text><text class="cp" x="64" y="634">Then lib.start calls once.Do. The first call starts the solver goroutine, whose defer close(e.ready) is the promise.</text></g>
<g class="v" style="animation-name:k32"><text class="cn2" x="20" y="634">3/8</text><text class="cp" x="64" y="634">Later the page asks /bibliothek/weg for the trace. once.Do does nothing now; the handler waits on e.ready or its request.</text></g>
<g class="v" style="animation-name:k33"><text class="cn2" x="20" y="634">4/8</text><text class="cp" x="64" y="634">A second visitor asks too. Any number of goroutines can wait on the same channel.</text></g>
<g class="v" style="animation-name:k34"><text class="cn2" x="20" y="634">5/8</text><text class="cp" x="64" y="634">Visitor 1 closes the tab, which cancels their request: that handler returns. The solver goes on for whoever comes next.</text></g>
<g class="v" style="animation-name:k35"><text class="cn2" x="20" y="634">6/8</text><text class="cp" x="64" y="634">The solver sets sol, res and err, then its deferred close(e.ready) wakes every waiter at once.</text></g>
<g class="v" style="animation-name:k36"><text class="cn2" x="20" y="634">7/8</text><text class="cp" x="64" y="634">What was written before the close is safe to read after the receive: no lock needed for e.res.</text></g>
<g class="v" style="animation-name:k37"><text class="cn2" x="20" y="634">8/8</text><text class="cp" x="64" y="634">A closed channel stays ready forever: for visitor 3, done() is true at once and the page carries the trace.</text></g>
<line class="sep" x1="20" y1="608" x2="960" y2="608"/><rect class="g run" x="20" y="695" width="22" height="14" rx="3"/><text class="mu" x="48" y="706" font-size="12">running</text><rect class="g blk" x="116.2" y="695" width="22" height="14" rx="3"/><text class="mu" x="144.2" y="706" font-size="12">blocked</text><line class="wt" x1="212.4" y1="702" x2="238.4" y2="702" marker-end="url(#aw)"/><text class="mu" x="246.4" y="706" font-size="12">waits on</text><rect class="g ext" x="321.2" y="695" width="22" height="14" rx="3"/><text class="mu" x="349.2" y="706" font-size="12">returned</text><rect class="ch" x="424" y="695" width="30" height="14" rx="3"/><text class="mu" x="460" y="706" font-size="12">channel</text><rect class="tk" x="528.2" y="695" width="26" height="14" rx="7"/><text class="mu" x="560.2" y="706" font-size="12">value</text><line class="fl" x1="615.2" y1="702" x2="641.2" y2="702" marker-end="url(#af)"/><text class="mu" x="649.2" y="706" font-size="12">data flow</text>
</svg>
