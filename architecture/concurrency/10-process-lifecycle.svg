<style>
svg{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--ln:#c4ccd5;--band:#f6f8fa;--run:#1a7f37;--runbg:#dafbe1;--blk:#bc4c00;--blkbg:#fff1e5;--ch:#0969da;--chbg:#ddf4ff;--tok:#8250df;--cls:#cf222e;--box:#f6f8fa}
