c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k97\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k56\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e1/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eRunConcurrent starts one goroutine per observer with wg.Go. Each works on its own copy of the board, at version 0.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k57\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e2/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eThe runner is the only reader of out. It blocks until a message arrives.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k58\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e3/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eB finds marks first and sends them; the runner keeps them pending: A has a lower level and is not idle at v0 yet.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k59\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e4/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eA finds marks too. The lowest level goes first: the runner applies A's marks, version 1. B's pending marks are stale now and dropped.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k60\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e5/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eBroadcast: put appends batch v1 to each mailbox and does a non-blocking send on notify. The runner never blocks here.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k61\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e6/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eBoth observers wake up and take their whole queue. A is quick; B's rule is slow this time.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k62\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e7/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eA sends new marks. No simpler rule exists, so the runner applies them at once: version 2.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k63\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e8/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eBroadcast v2. A wakes up. B is busy, so its wake-up waits in the 1-slot buffer of notify.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k64\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e9/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eA catches up and finds more marks: version 3.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k65\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e10/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eBroadcast v3. B's notify slot is still full, so this wake-up is dropped; batch v3 is queued all the same.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k66\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e11/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eMeanwhile B reports marks from v1. The runner is busy, but out has room for one message per observer: B does not block.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k67\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e12/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eThe runner reads B's message from the buffer. Marks found on v1 are stale at v3 and ignored: B will deduce again.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k68\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e13/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eB's select finds the pending wake-up without blocking. take returns v2 and v3 together: one wake-up was enough.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k69\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e14/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eNeither finds anything new: both report idle at v3 and wait for the next broadcast.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k70\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e15/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eEvery observer is idle at the current version, so nothing is in flight. The deferred close(quit) wakes both at once; wg.Wait waits for them.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k71\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e16/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eThe observers return; wg counts down to 0 and wg.Wait returns. No goroutine outlives RunConcurrent.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"528\" x2=\"1260\" y2=\"528\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"615\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"626\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"615\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"626\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"622\" x2=\"238.4\" y2=\"622\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"626\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"615\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"626\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"615\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"626\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"615\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"626\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"622\" x2=\"641.2\" y2=\"622\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"626\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"RunConcurrent starts one goroutine per observer with wg.Go. Each works on its own copy of the board, at version 0.","ops":["runner: wg.Go → observer A (level 1) starts, counter 1","runner: wg.Go → observer B (level 3) starts, counter 2","observer A (level 1): deduces on v0","observer B (level 3): deduces on v0"]},{"t0":5.07,"t1":5.42,"caption":"The runner is the only reader of out. It blocks until a message arrives.","ops":["runner: \u003c-out → blocks"]},{"t0":8.88,"t1":9.98,"caption":"B finds marks first and sends them; the runner keeps them pending: A has a lower level and is not idle at v0 yet.","ops":["observer B (level 3): select { out \u003c- marks@v0 | \u003c-quit } → hands marks@v0 to runner, who wakes up","runner: runner state: version 0, pending: B marks@v0, idle: –","runner: \u003c-out → blocks","observer B (level 3): select { \u003c-notify | \u003c-quit } → blocks"]},{"t0":14.67,"t1":15.77,"caption":"A finds marks too. The lowest level goes first: the runner applies A's marks, version 1. B's pending marks are stale now and dropped.","ops":["observer A (level 1): select { out \u003c- marks@v0 | \u003c-quit } → hands marks@v0 to runner, who wakes up","runner: runner state: version 1, pending: – (B's dropped), idle: –","observer A (level 1): select { \u003c-notify | \u003c-quit } → blocks"]},{"t0":21.06,"t1":22.16,"caption":"Broadcast: put appends batch v1 to each mailbox a ass=\"tk\" x=\"-30.1\" y=\"-10\" width=\"60.2\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e5 steps\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k45\"\u003e\u003crect class=\"tk\" x=\"-10.3\" y=\"-10\" width=\"20.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e3\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k46\"\u003e\u003crect class=\"tk\" x=\"-30.1\" y=\"-10\" width=\"60.2\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e3 steps\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k47\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k48\"\u003e\u003crect class=\"tk\" x=\"-30.1\" y=\"-10\" width=\"60.2\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e3 steps\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k49\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k32\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e1/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe rules are stuck; four free cells c0 to c3 are candidates. lookahead makes hyps with one slot each and an unbuffered jobs channel, and starts GOMAXPROCS workers\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"533\"\u003e(two here).\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k33\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e2/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eIt sends the indices one by one. Each send is a handoff: index 0 to worker 1, index 1 to worker 2. Each tries a star on its cell, on its own copy of the board.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k34\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e3/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eBoth workers are busy, so the send of index 2 blocks until one of them comes back to its range loop.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k35\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e4/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe star on c1 leads to a contradiction in 5 steps. Worker 2 writes the chain into hyps[1]: its own slot, so no lock and no channel.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k36\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e5/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 2 takes index 2, which releases the caller. Its send of index 3 blocks again.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k37\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e6/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe star on c0 leads to no contradiction: hyps[0] stays nil. Worker 1 takes index 3, and the caller closes jobs and waits.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k38\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e7/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003ec2 and c3 both lead to a contradiction in 3 steps. Each worker writes its slot, and its range ends on the closed, empty jobs: it returns.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k39\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e8/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003ewg.Wait returns: every write to hyps happened before it, so the caller can read them all without a lock.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k40\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e9/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe best chain is picked in index order with a strict comparison: c2 beats c1, and the tie with c3 keeps the earlier c2. Which worker finished first never matters.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"488\" x2=\"1260\" y2=\"488\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"586\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"586\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"582\" x2=\"238.4\" y2=\"582\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"586\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"586\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"575\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"586\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"575\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"586\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"582\" x2=\"641.2\" y2=\"582\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"586\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"The rules are stuck; four free cells c0 to c3 are candidates. lookahead makes hyps with one slot each and an unbuffered jobs channel, and starts GOMAXPROCS workers (two here).","ops":["lookahead: wg.Go → worker 1 starts, counter 1" n\u003cg class=\"v\" style=\"animation-name:k31\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"594\"\u003e2/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"594\"\u003eAttempt 0: acquire is a send into each buffer. Then the loop checks best and Done (a select with default), and starts the attempt with its own random generator.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k32\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"594\"\u003e3/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"594\"\u003eAttempt 1 the same way. Now both buffers are full: three attempts run in the process, two of them from this call.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k33\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"594\"\u003e4/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"594\"\u003eFor attempt 2 the send on slots blocks: a buffered channel is a counting semaphore, and its buffer is full.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k34\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"594\"\u003e5/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"594\"\u003eAttempt 1 succeeds first. It writes results[1] and lowers best from 1000 to 1 with a compare-and-swap loop.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k35\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"594\"\u003e6/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"594\"\u003eIts deferred release receives from cpuSlots, then from slots. That frees the loop: its waiting value moves into the buffer of slots.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k36\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"594\"\u003e7/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"594\"\u003eThe loop acquires cpuSlots too, but 2 \u0026gt; best: attempt 2 would lose anyway and is not started. It releases both and waits for attempt 0.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k37\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"594\"\u003e8/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"594\"\u003eAttempt 0 goes on: its index is below best, so it can still win. It succeeds, writes results[0] and lowers best to 0.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k38\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"594\"\u003e9/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"594\"\u003erun returns results[0], the lowest successful attempt: the same puzzle as with one worker. More workers only make it arrive sooner.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"568\" x2=\"1260\" y2=\"568\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"655\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"666\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"655\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"666\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"662\" x2=\"238.4\" y2=\"662\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"666\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"655\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"666\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"655\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"666\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"655\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"666\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"662\" x2=\"641.2\" y2=\"662\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"666\" font-size=\"12\"\u003edata flow\u003c/tex x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k79\"\u003e\u003crect class=\"tk\" x=\"-33.4\" y=\"-10\" width=\"66.8\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eres 13 ✗\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k80\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k81\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k56\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e1/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eSearch makes two unbuffered channels and starts two workers with wg.Go. Each ranges over jobs and blocks: nothing is sent yet.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k57\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e2/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eIt starts a producer and a closer, which waits for the workers. The caller itself ranges over results.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k58\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e3/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eUnbuffered means every send is a handoff to a waiting receiver: seed 10 goes to worker 1, seed 11 to worker 2.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k59\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e4/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eNo worker is free, so the producer blocks in its select until one takes seed 12 or the context is cancelled.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k60\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e5/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 2 finishes first. Seed 11 is out of order: the caller keeps it in the reorder buffer.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k61\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e6/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 2 asks for the next seed: the producer's waiting send completes. It offers seed 13 and blocks again.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k62\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e7/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 1 delivers seed 10. Now 10 and 11 are in sequence: the caller emits both, from one goroutine, and writes their files.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k63\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e8/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 2 finishes seed 12 while the caller is still writing. Its send must wait: back-pressure through the unbuffered channel.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k64\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e9/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eCtrl-C cancels the context: ctx.Done() is closed. The producer's select wakes up and returns; its deferred close(jobs) follows.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k65\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e10/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe caller takes seed 12 and emits it. Worker 2's range over the closed jobs ends: it returns, wg counts down.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k66\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e11/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eSeed 13 comes back with an error because it was cancelled. The caller drops it: a gap where the run ends.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k67\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e12/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe last worker is gone, so wg.Wait returns and the closer closes results. That ends the caller's range loop.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k68\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e13/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eSearch returns 13, the first seed not emitted: -from 13 continues the run without holes.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"488\" x2=\"1260\" y2=\"488\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"586\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"586\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"582\" x2=\"238.4\" y2=\"582\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"586\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"586\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"575\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"586\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"575\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"586\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"582\" x2=\"641.2\" y2=\"582\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"586\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"Search makes two unbuffered channels and starts two workers with wg.Go. Each ranges over jobs and blocks: nothing is sent yet.","ops":["caller: wg.Go → worker 1 starts, counter 1","caller: wg.Go → worker 2 starts, counter 2","worker 1: range jobs → blocks","worker 2: range jobs → blocks"]},{"t0":5.43,"t1":5.78,"caption":"It starts a producer and a closer, which waits for the workers. The caller itself ranges over results.","ops":["caller: go → producer starts","caller: go → closer starts","closer: wg.Wait() → blocks, counter 2","caller: range results → blocks"]},{"t0":10.14,"t1":11.24,"caption":"Unbuffered means every send is a handoff to a waiting receiver: seed 10 goes to worker 1, seed 11 to worker 2.","ops":["producer: select { jobs \u003c- seed 10 | \u003c-ctx.Done() } → hands seed 10 to worker 1, who wakes up","producer: select { jobs \u003c- seed 11 | \u003c-ctx.Done() } → hands seed 11 to worker 2, who wakes up","worker 1: check(seed 10)","worker 2: check(seed 11)"]},{"t0":15.84,"t1":16.94,"caption":"No worker is free, so the producer blocks in its select until one takes seed 12 or the context is cancelled.","ops":["producer: select { jobs \u003c- seed 12 | \u003c-ctx.Done() } → blocks"]},{"t0":21.48,"t1":22.58,"caption":"Worker 2 finishes first. Seed 11 is out of order: the caller keeps it in the reorder buffer.","ops":["worker 2: results \u003c- res 11 → hands res 11 to caller, who wakes up","caller: reorder buffer: next 10, pending 11","caller: range results → blocks"]},{"t0":26.64,"t1":27.74,"caption":"Worker 2 asks for the next seed: the producer's waiting send completes. It offers seed 13 and blocks again.","ops":["worker 2: range jobs → takes seed 12 from producer, who wakes up","worker 2: check(seed 12)","producer: select { jobs \u003c- seed 13 | \u003c-ctx.Done() } → blocks"]},{"t0":32.25,"t1":33.35,"caption":"Worker 1 delivers seed 10. Now 10 and 11 are in sequence: the caller emits both, from one goroutine, and writes their files.","ops":["worker 1: results \u003c- res 10 → hands res 10 to caller, who wakes up","caller: reorder buffer: next 12, pending –","caller: emit: writes files","worker 1: range jobs → takes seed 13 from producer, who wakes up","worker 1: check(seed 13)","producer: select { jobs \u003c- seed 14 | \u003c-ctx.Done() } → blocks"]},{"t0":38.37,"t1":39.47,"caption":"Worker 2 finishes seed 12 while the caller is still writing. Its send must wait: back-pressure through the unbuffered channel.","ops":["worker 2: results \u003c- res 12 → blocks"]},{"t0":44.55,"t1":45.65,"caption":"Ctrl-C cancels the context: ctx.Done() is closed. The producer's select wakes up and returns; its deferred close(jobs) follows.","ops":["Ctrl-C: close(ctx.Done()) → wakes producer","producer: close(jobs), nobody waits on it","producer returns (returned)","worker 1: generator sees Done, aborts seed 13"]},{"t0":50.76,"t1":51.86,"caption":"The caller takes seed 12 and emits it. Worker 2's range over the closed jobs ends: it returns, wg counts down.","ops":["caller: range results → takes res 12 from worker 2, who wakes up","caller: reorder buffer: next 13, pending –","worker 2: range jobs → jobs is closed: the loop ends","worker 2 returns (returned)","  wg counter 1","caller: range results → blocks"]},{"t0":56.46,"t1":57.56,"caption":"Seed 13 comes back with an error because it was cancelled. The caller drops it: a gap where the run ends.","ops":["worker 1: results \u003c- res 13 ✗ → hands res 13 ✗ to caller, who wakes up","caller: cancelled: dropped","caller: range results → blocks","worker 1: range jobs → jobs is closed: the loop ends","worker 1 returns (returned)","  wg counter 0","  closer: wg.Wait() returns"]},{"t0":62.01,"t1":63.11,"caption":"The last worker is gone, so wg.Wait returns and the closer closes results. That ends the caller's range loop.","ops":["closer: close(results) → wakes caller","closer returns (returned)"]},{"t0":67.68,"t1":68.03,"caption":"Search returns 13, the first seed not emitted: -from 13 continues the run without holes.","ops":["caller returns (returns 13)"]}]},{"id":"05-designer-stream","title":"5. The designer's search: workers until k puzzles, results and progress in one select","source":"internal/designer/designer.go","total":56.58,"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" width=\"1280\" height=\"720\" role=\"img\" aria-label=\"5. The designer's search: workers until k puzzles, results and progress in one select\"\u003e\n\u003ctitle\u003e5. The designer's search: workers until k puzzles, results and progress in one select\u003c/title\u003e\n\u003cstyle\u003e\nsvg{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--ln:#c4ccd5;--run:#1a7f37;--runbg:#dafbe1;--blk:#bc4c00;--blkbg:#fff1e5;--ext:#818b98;--extbg:#f6f8fa;--ch:#0969da;--chbg:#ddf4ff;--tok:#8250df;--tokfg:#ffffff;--cls:#cf222e;--box:#f6f8fa}\n@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--ln:#3d444d;--run:#3fb950;--runbg:#12261e;--blk:#f0883e;--blkbg:#2d1b0e;--ext:#656c76;--extbg:#151b23;--ch:#4493f8;--chbg:#0c2d6b;--tok:#a371f7;--tokfg:#ffffff;--cls:#f85149;--box:#151b23}}\ntext{font:13px system-ui,-apple-system,\"Segoe UI\",Helvetica,Arial,sans-serif;fill:var(--fg)}\n.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}\n.bg{fill:var(--bg)}.ti{font-size:16px;font-weight:600}.so,.mu{fill:var(--mut)}\n.fl{stroke:var(--ln);stroke-width:2;fill:none}.fa{fill:var(--ln)}\n.wt{stroke:var(--blk);stroke-width:1.5;stroke-dasharray:5 4;fill:none}.wa{fill:var(--blk)}\n.g{stroke-width:1.5}.run{fill:var(--runbg);stroke:var(--run)}.blk{fill:var(--blkbg);stroke:var(--blk)}.ext{f \"v\" style=\"animation-name:k47\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e2/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eA waiter will close out after wg.Wait. The handler waits in a select: a candidate on out, or the ticker.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k48\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e3/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eEvery 500 ms the ticker fires. The handler writes the counters, atomics the workers count up, and selects again.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k49\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e4/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eWorker 1 has a puzzle, A. Under s.mu, accept finds it new and the first of 2. The solver rates it outside the lock.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k50\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e5/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eIt sends A on out, a handoff to the waiting handler, which writes a line. Worker 1 goes on with a new seed.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k51\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e6/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eWorker 2's seed gave A as well. accept counts a duplicate, and worker 2 draws the next seed, also under the lock.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k52\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e7/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eWorker 2 finds B, the second of 2. accept calls s.cancel(): ctx.Done() is closed. The budget of attempts and a closed page end the search the same way.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k53\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e8/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eWorker 1's running attempt polls ctx.Done() and gives up. Its loop sees ctx.Err() and ends; worker 1 returns.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k54\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e9/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eB is rated and sent, a handoff again. Worker 2's loop ends too: wg counts down to 0. The handler receives until out is closed, so no send is left waiting.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k55\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e10/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003ewg.Wait returns: the waiter cancels the context (also when nothing did yet) and closes out.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k56\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e11/11\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eThe handler's select sees out closed: it writes done with the final counters and returns.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"608\" x2=\"1260\" y2=\"608\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"706\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"706\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"702\" x2=\"238.4\" y2=\"702\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"706\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"706\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"695\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"706\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"695\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"706\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"702\" x2=\"641.2\" y2=\"702\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"706\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"The page asks for 2 proposals. run derives a context it can cancel from the request's, makes out unbuffered and starts one worker per core but one, 2 here.","ops":["handler: wg.Go → worker 1 starts, counter 1","handler: wg.Go → worker 2 starts, counter 2","worker 1: Complete(seed 4711)","worker 2: Complete(seed 815)"]},{"t0":6.3,"t1":6.65,"caption":"A waiter will close out after wg.Wait. The handler waits in a select: a candidate on out, or the ticker.","ops":["handler: go → waiter starts","waiter: wg.Wait() → blocks, counter 2","handler: select { \u003c-out | \u003c-tick.C } → blocks"]},{"t0":11.07,"t1":12.17,"caption":"Every 500 ms the ticker fires. The handler writes the counters, atomics the workers count up, and selects again.","ops":["time.Ticker: tick.C \u003c- tick → hands tick to handler, who wakes up","handler: writes the counters","handler: select { \u003c-out | \u003c-tick.C } → blocks"]},{"t0":16.83,"t1":17.18,"caption":"Worker 1 has a puzzle, A. Under s.mu, accept finds it new and the first of 2. The solver rates it outside the lock.","ops":["worker 1: s.mu.Lock() → holds it","worker 1: s.mu.Unlock()","worker 1: solver rates A"]},{"t0":21.93,"t1":23.03,"caption":"It sends A on out, a handoff to the waiting handler, which writes a line. Worker 1 goes on with a new seed.","ops":["worker 1: out \u003c- A → hands A to handler, who wakes up","handler: writes A, "445\"\u003epuzzle sent\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k22\"\u003e\u003ctext class=\"m\" x=\"1058\" y=\"293\"\u003e5: –\u003c/text\u003e\u003ctext class=\"m\" x=\"1058\" y=\"308\"\u003e6: ready\u003c/text\u003e\u003ctext class=\"m\" x=\"1058\" y=\"323\"\u003e7: –\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k23\"\u003e\u003crect class=\"g run\" x=\"747\" y=\"264\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"860\" y=\"283\"\u003efill\u003c/text\u003e\u003ctext class=\"gf m\" x=\"860\" y=\"298\"\u003eweb.Pool.fill\u003c/text\u003e\u003ctext class=\"gs m s-run\" x=\"860\" y=\"315\"\u003egot 5\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k24\"\u003e\u003ctext class=\"m\" x=\"1058\" y=\"293\"\u003e5: ready\u003c/text\u003e\u003ctext class=\"m\" x=\"1058\" y=\"308\"\u003e6: ready\u003c/text\u003e\u003ctext class=\"m\" x=\"1058\" y=\"323\"\u003e7: ready\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k26\"\u003e\u003crect class=\"g blk\" x=\"747\" y=\"264\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"860\" y=\"283\"\u003efill\u003c/text\u003e\u003ctext class=\"gf m\" x=\"860\" y=\"298\"\u003eweb.Pool.fill\u003c/text\u003e\u003ctext class=\"gs m s-blk\" x=\"860\" y=\"315\"\u003eblocked: range queue\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k35\"\u003e\u003crect class=\"tk\" x=\"-10.3\" y=\"-10\" width=\"20.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e5\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k36\"\u003e\u003crect class=\"tk\" x=\"-10.3\" y=\"-10\" width=\"20.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e6\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k37\"\u003e\u003crect class=\"tk\" x=\"-10.3\" y=\"-10\" width=\"20.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e7\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k38\"\u003e\u003crect class=\"tk\" x=\"-16.9\" y=\"-10\" width=\"33.8\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e5×5\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k39\"\u003e\u003crect class=\"tk\" x=\"-16.9\" y=\"-10\" width=\"33.8\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e5×5\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k40\"\u003e\u003crect class=\"tk\" x=\"-10.3\" y=\"-10\" width=\"20.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e5\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k41\"\u003e\u003crect class=\"tk\" x=\"-16.9\" y=\"-10\" width=\"33.8\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e6×6\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k42\"\u003e\u003crect class=\"tk\" x=\"-16.9\" y=\"-10\" width=\"33.8\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e7×7\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k43\"\u003e\u003crect class=\"tk\" x=\"-16.9\" y=\"-10\" width=\"33.8\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e5×5\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k27\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"574\"\u003e1/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"574\"\u003eserve calls NewPool for every size (three here: 5, 6 and 7). It queues them smallest first: the capacity is the number of sizes, so these sends never block.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k28\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"574\"\u003e2/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"574\"\u003eIt starts one fill goroutine for all sizes and returns; serve goes on. fill ranges over the queue and takes 5.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k29\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"574\"\u003e3/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"574\"\u003eThe 5×5 puzzle is ready. fill stores it under the mutex, then takes size 6. The generator inside is already parallel, so one fill goroutine is enough.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k30\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"574\"\u003e4/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"574\"\u003eA player asks for a new 5×5 puzzle. takePuzzle takes the mutex. Meanwhile fill finishes 6×6 and has to wait for the mutex.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k31\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"574\"\u003e5/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"574\"\u003eThe request hands out the ready 5×5 at once and queues 5 for a refill, still holding the mutex. That send cannot block: 5 was not in the queue while its puzzle was\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"593\"\u003eready.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k32\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"574\"\u003e6/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"574\"\u003eIt unlocks, which lets fill in to store 6×6. The player already has their puzzle.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k33\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"574\"\u003e7/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"574\"\u003efill works through the queue one size at a time: 7, then 5 again. Each size is queued at most once, so the queue never needs more room than one slot per size.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k34\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"574\"\u003e8/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"574\"\u003eEvery size is ready. The queue is empty and fill blocks in its range until the next puzzle is handed out, for as long as the server runs.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"548\" x2=\"1260\" y2=\"548\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"635\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"646\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"635\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"646\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"642\" x2=\"238.4\" y2=\"642\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"646\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"635\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"646\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"635\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"646\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"635\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"646\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"642\" x2=\"641.2\" y2=\"642\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"646\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":1.1,"caption":"serve calls NewPool for every size (three here: 5, 6 and 7). It queues them smallest first: the capacity is the number of sizes, so these sends never block.","ops":["NewPool: queue \u003c- 5 → 5 waits in the buffer of queue","NewPool: queue \u003c- 6 → 6 waits in the buffer of queue","NewPool: queue \u003c- 7 → 7 waits in the buffer of queue"]},{"t0":7.08,"t1":8.18,"caption":"It starts one fill re(7): generate, solve\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k11\"\u003e\u003crect class=\"g run\" x=\"747\" y=\"244\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"860\" y=\"263\"\u003epreparer (gen 1)\u003c/text\u003e\u003ctext class=\"gf m\" x=\"860\" y=\"278\"\u003eparty.Manager.startPrep\u003c/text\u003e\u003ctext class=\"gs m s-run\" x=\"860\" y=\"295\"\u003eprepare(5): generate, solve\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k12\"\u003e\u003ctext class=\"m\" x=\"1058\" y=\"273\"\u003eprepGen 1\u003c/text\u003e\u003ctext class=\"m\" x=\"1058\" y=\"288\"\u003eready: 1 puzzle\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k13\"\u003e\u003crect class=\"g ext\" x=\"27\" y=\"384\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"140\" y=\"403\"\u003eTick\u003c/text\u003e\u003ctext class=\"gf m\" x=\"140\" y=\"418\"\u003eparty.Manager.Tick\u003c/text\u003e\u003ctext class=\"gs m s-ext\" x=\"140\" y=\"435\"\u003ereturned\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k14\"\u003e\u003ctext class=\"m\" x=\"1058\" y=\"273\"\u003eprepGen 2\u003c/text\u003e\u003ctext class=\"m\" x=\"1058\" y=\"288\"\u003eready: 1 puzzle\u003c/text\u003e\u003ctext class=\"m\" x=\"1058\" y=\"303\"\u003edeleted from pm.parties\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k15\"\u003e\u003crect class=\"g ext\" x=\"747\" y=\"244\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"860\" y=\"263\"\u003epreparer (gen 1)\u003c/text\u003e\u003ctext class=\"gf m\" x=\"860\" y=\"278\"\u003eparty.Manager.startPrep\u003c/text\u003e\u003ctext class=\"gs m s-ext\" x=\"860\" y=\"295\"\u003ereturned\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k16\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e1/7\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eA player creates a party against the clock, which keeps 3 puzzles ready. Create holds pm.mu; startPrep bumps prepGen to 1 and starts a preparer that keeps its own\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"533\"\u003ecopy, gen = 1.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k17\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e2/7\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe preparer needs the lock to read the party. Create still holds it, so Lock blocks until Create returns.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k18\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e3/7\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eprepGen is still 1, so the preparation is current. It picks a size and unlocks: the slow part runs without the lock, and requests are not held up by the generator.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k19\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e4/7\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe puzzle is ready. With the lock held again it checks prepGen (still 1), appends the puzzle, signals the streams (update), and goes for the next one.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k20\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e5/7\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eEverybody has left. Later Tick, under the lock, finds the party idle: it deletes it, bumps prepGen to 2 and signals the streams a last time.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k21\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e6/7\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eprepare cannot be interrupted, but when it is done and the preparer holds the lock, prepGen 2 ≠ its gen 1: it unlocks and returns, and its puzzle is never used.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k22\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e7/7\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eNo channel was needed: the party lives behind pm.mu anyway. When the state is behind a mutex, a generation number is simpler than a cancel channel.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"488\" x2=\"1260\" y2=\"488\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"586\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"586\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"582\" x2=\"238.4\" y2=\"582\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"586\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"586\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"575\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"586\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"575\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"586\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"582\" x2=\"641.2\" y2=\"582\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"586\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"A player creates a party against the clock, which keeps 3 puzzles ready. Create holds pm.mu; startPrep bumps prepGen to 1 and starts a preparer that keeps its own copy, gen = 1.","ops":["request: create party starts (net/http: new request)","request: create party: pm.mu.Lock() → holds it","request: create party: go → preparer (gen 1) starts"]},{"t0":6.96,"t1":7.31,"caption":"The preparer needs the lock to read the party. Create still holds it, so Lock blocks until Create returns.","ops":["preparer (gen 1): pm.mu.Lock() → blocks, request: create party holds it","request: create party: pm.mu.Unlock() → preparer (gen 1) gets the lock and wakes up","request: create party returns (returned: code ABCD)"]},{"t0":11.79,"t1":12.14,"caption":"prepGen is still 1, so the preparation is current. It picks a size and unlocks: the slow part runs without the lock, and requests are not held up by the generator.","ops":["preparer (gen 1): pm.mu.Unlock()","preparer (gen 1): prepare(7): generate, solve"]},{"t0":18.33,"t1":18.68,"caption":"The puzzle is ready. With the lock held again it checks prepGen (still 1), appends the puzzle, signals the streams (update), and goes for the next one.","ops":["preparer (gen 1): pm.mu.Lock() → holds it","preparer (gen 1): pm.mu.Unlock()","preparer (gen 1): pm.mu.Lock() → holds it","preparer (gen 1): pm.mu.Unlock()","preparer (gen 1): prepare(5): generate, solve"]},{"t0":24.51,"t1":24.86,"caption":"Everybody has left. Later Tick, under the lock, finds the party idle: it deletes it, bumps prepGen to 2 and signals the streams a last time.","ops":["Tick starts (Manager.Run: ticker)","Tick: pm.mu.Lock() → holds it","Tick: pm.mu.Unlock()","Tick returns (returned)"]},{"t0":30.36,"t1":30.71,"caption":"prepare cannot be interrupted, but when it is done and the preparer holds the lock, prepGen 2 ≠ its gen 1: it unlocks and returns, and its puzzle is never used.","ops":["preparer (gen 1): pm.mu.Lock() → holds it","preparer (gen 1): pm.mu.Unlock()","preparer (gen 1): gen 1 ≠ 2: result dropped","preparer (gen 1) returns (returned)"]},{"t0":36.87,"t1":37.22,"caption":"No channel was needed: the party lives behind pm.mu anyway. When the state is behind a mutex, a generation number is simpler than a cancel channel.","ops":[]}]},{"id":"08-library-future","title":"8. Lazy solving of library puzzles: a future from sync.Once and close","source":"internal/web/library.go","total":37.83,"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" width=\"1280\" height=\"720\" role=\"img\" aria-label=\"8. Lazy solving of library puzzles: a future from sync.Once and close\"\u003e\n\u003ctitle\u003e8. Lazy solving of library puzzles: a future from sync.Once and close\u003c/title\u003e\n\u003cstyle\u003e\nsvg{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--ln:#c4ccd5;--run:#1a7f37;--runbg:#dafbe1;--blk:#bc4c00;--blkbg:#fff1e5;--ext:#818b98;--extbg:#f6f8fa;--ch:#0969da;--chbg:#ddf4ff;--tok:#8250df;--tokfg:#ffffff;--cls:#cf222e;--box:#f6f8fa}\n@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--ln:#3d444d;--run:#3fb950;--runbg:#12261e;--blk:#f0883e;--blkbg:#2d1b0e;--ext:#656c76;--extbg:#151b23;--ch:#4493f8;--chbg:#0c2d6b;--tok:#a371f7;--tokfg:#ffffff;--cls:#f85149;--box:#151b23}}\ntext{font:13px system-ui,-apple-system,\"Segoe UI\",Helvetica,Arial,sans-serif;fill:var(--fg)}\n.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}\n.bg{fill:var(--bg)}.ti{font-size:16px;font-weight:600}.so,.mu{fill:var(--mut)}\n.fl{stroke:var(--ln);stroke-width:2;fill:none}.fa{fill:var(--ln)}\n.wt{stroke:var(--blk);stroke-width:1.5;stroke-dasharray:5 4;fill:none}.wa{fill:var(--blk)}\n.g{stroke-width:1.5}.run{fill:var(--runbg);stroke:var(--run)}.blk{fill:var(--blkbg);stroke:var(--blk)}.ext{fill:var(--extbg);stroke:var(--ext)}.out{fill:var(--bg);stroke:var(--mut);stroke-dasharray:4 3}\n.gn{font-weight:600;text-anchor:middle}.gf{fill:var(--mut);text-anchor:middle}.gs{text-anchor:middle}\n.s-run{fill:var(--run)}.s-blk{fill:var(--blk)}.s-ext{fill:var(--ext)}.s-out{fill:var(--mut)}\n.ch{fill:var(--chbg);stroke:var(--ch);stroke-width:1.5}.sl{fill:none;stroke:var(--ch);stroke-dasharray:3 3;opa 3cg class=\"v\" style=\"animation-name:k24\"\u003e\u003crect class=\"g run\" x=\"697\" y=\"364\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"810\" y=\"383\"\u003e/weg #2\u003c/text\u003e\u003ctext class=\"gf m\" x=\"810\" y=\"398\"\u003eweb.libraryRoutes\u003c/text\u003e\u003ctext class=\"gs m s-run\" x=\"810\" y=\"415\"\u003ee.ready closed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k25\"\u003e\u003crect class=\"g ext\" x=\"527\" y=\"74\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"640\" y=\"93\"\u003esolver\u003c/text\u003e\u003ctext class=\"gf m\" x=\"640\" y=\"108\"\u003eweb.Library.start\u003c/text\u003e\u003ctext class=\"gs m s-ext\" x=\"640\" y=\"125\"\u003ereturned\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k26\"\u003e\u003crect class=\"cx\" x=\"592\" y=\"238\" width=\"96\" height=\"34\" rx=\"6\"/\u003e\u003ctext class=\"ct\" x=\"640\" y=\"260\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k27\"\u003e\u003ctext class=\"m\" x=\"1021\" y=\"121\"\u003eset\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k28\"\u003e\u003crect class=\"g ext\" x=\"697\" y=\"364\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"810\" y=\"383\"\u003e/weg #2\u003c/text\u003e\u003ctext class=\"gf m\" x=\"810\" y=\"398\"\u003eweb.libraryRoutes\u003c/text\u003e\u003ctext class=\"gs m s-ext\" x=\"810\" y=\"415\"\u003ereturned\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k29\"\u003e\u003crect class=\"g ext\" x=\"1037\" y=\"364\" width=\"226\" height=\"72\" rx=\"8\"/\u003e\u003ctext class=\"gn\" x=\"1150\" y=\"383\"\u003epage #3\u003c/text\u003e\u003ctext class=\"gf m\" x=\"1150\" y=\"398\"\u003eweb.libraryRoutes\u003c/text\u003e\u003ctext class=\"gs m s-ext\" x=\"1150\" y=\"415\"\u003epage sent with trace\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k38\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k39\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k40\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k30\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e1/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eVisitor 1 opens a library puzzle (page #1). Building the page, done() peeks at e.ready with a select with default: it never blocks.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k31\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e2/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eThen lib.start calls once.Do. The first call starts the solver goroutine, whose defer close(e.ready) is the promise.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k32\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e3/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eLater the page asks /bibliothek/weg for the trace (/weg #1). once.Do does nothing now; the handler waits on e.ready or its request.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k33\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e4/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eA second visitor asks too (/weg #2). Any number of goroutines can wait on the same channel.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k34\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e5/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eVisitor 1 closes the tab, which cancels their request: that handler returns. The solver goes on for whoever comes next.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k35\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e6/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eThe solver sets sol, res and err, then its deferred close(e.ready) wakes every waiter at once.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k36\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e7/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eWhat was written before the close is safe to read after the receive: no lock needed for e.res.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k37\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e8/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eA closed channel stays ready forever: for visitor 3 (page #3), done() is true at once and the page carries the trace.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"608\" x2=\"1260\" y2=\"608\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"706\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"706\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"702\" x2=\"238.4\" y2=\"702\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"706\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"706\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"695\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"706\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"695\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"706\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"702\" x2=\"641.2\" y2=\"702\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"706\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"Visitor 1 opens a library puzzle (page #1). Building the page, done() peeks at e.ready with a select with default: it never blocks.","ops":["page #1 starts (net/http: new request)","page #1: select { \u003c-e.ready | default } → default: not ready"]},{"t0":5.58,"t1":5.93,"caption":"Then lib.start calls once.Do. The first call starts the solver goroutine, whose defer close(e.ready) is the promise.","ops":["page #1: e.once.Do → first call, runs the function","page #1: once.Do: go → solver starts","solver: bruteforce, then solve","page #1 returns (page sent, no trace yet)"]},{"t0":10.71,"t1":11.06,"caption":"Later the page asks /bibliothek/weg for the trace (/weg #1). once.Do does nothing now; the handler waits on e.ready or its request.","ops":["/weg #1 starts (net/http: new request)","/weg #1: e.once.Do → already done, does nothing","/weg #1: select { \u003c-e.ready | \u003c-r.Context().Done() } → blocks"]},{"t0":16.29,"t1":16.64,"caption":"A second visitor asks too (/weg #2). Any number of goroutines can wait on the same channel.","ops":["/weg #2 starts (net/http: new request)","/weg #2: e.once.Do → already done, does nothing","/weg #2: select { \u003c-e.ready | \u003c-r.Context().Done() } → blocks"]},{"t0":20.67,"t1":21.77,"caption":"Visitor 1 closes the tab, which cancels their request: that handler returns. The solver goes on for whoever comes next.","ops":["visitor 1: close x=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e{}\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k49\"\u003e\u003crect class=\"tk\" x=\"-13.6\" y=\"-10\" width=\"27.2\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e{}\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k50\"\u003e\u003crect class=\"tk\" x=\"-13.6\" y=\"-10\" width=\"27.2\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e{}\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k51\"\u003e\u003crect class=\"tk\" x=\"-20.2\" y=\"-10\" width=\"40.4\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003etick\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k52\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k53\"\u003e\u003crect class=\"tk\" x=\"-13.6\" y=\"-10\" width=\"27.2\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003e{}\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k36\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e1/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003eTwo players have the party open; each browser holds an event stream. Subscribe makes a channel with a buffer of 1 per stream, and the handler sends the current\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"693\"\u003estate.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k37\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e2/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003eBoth wait in a select on three channels: their request's context, the change signal, and a heartbeat ticker.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k38\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e3/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003eA player gets ready. The request, holding pm.mu, broadcasts: signal does a non-blocking send to each stream. Both wake up and send version 2.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k39\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e4/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003eStream A is quickly back in its select. Stream B's client is slow: B is still writing.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k40\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e5/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003eTwo changes in a burst (versions 3 and 4). A takes the first signal at once, the second waits in its slot. B's slot holds one already, so the second is dropped.\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"693\"\u003eThe publisher never blocks.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k41\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e6/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003eNothing is lost: a signal carries no data, and the stream reads the current state when it wakes. B finds its pending signal and sends version 4, which has both\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"693\"\u003echanges. So does A.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k42\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e7/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003eTwenty quiet seconds later the ticker fires. A writes a comment line, a keep-alive that stops proxies from closing an idle connection.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k43\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e8/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003ePlayer B closes the tab: their request's context is cancelled. B's select returns, and the deferred cancel unsubscribes its channel.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k44\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"674\"\u003e9/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"674\"\u003ePlayer A leaves too, the stream stays open. When the party expires, Tick signals its streams once more; A's Snapshot fails, so it sends a final gone event and\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"693\"\u003ereturns.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"648\" x2=\"1260\" y2=\"648\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"735\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"746\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"735\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"746\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"742\" x2=\"238.4\" y2=\"742\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"746\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"735\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"746\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"735\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"746\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"735\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"746\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"742\" x2=\"641.2\" y2=\"742\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"746\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"cap ss=\"tl m\" y=\"4\"\u003eErrClosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k25\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"534\"\u003e1/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"534\"\u003eserve: signal.NotifyContext turns Ctrl-C and SIGTERM into a cancelled ctx. The party manager's loop runs as Run(5 s, ctx.Done()): a select on a ticker and a stop\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"553\"\u003echannel.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k26\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"534\"\u003e2/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"534\"\u003eListenAndServe blocks for the server's whole life, so it runs in a goroutine of its own and will send its error on errc, a channel with capacity 1.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k27\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"534\"\u003e3/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"534\"\u003eThe main goroutine waits for whichever comes first: an error of the server, or the end of ctx.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k28\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"534\"\u003e4/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"534\"\u003eEvery 5 seconds the ticker fires: Run wakes up and calls Tick (sections 7 and 9).\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k29\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"534\"\u003e5/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"534\"\u003eThen it selects again, until the next tick or the stop.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k30\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"534\"\u003e6/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"534\"\u003eCtrl-C: ctx is cancelled, its Done channel closed. Both selects wake up: Run returns, serve goes on to shut down. Request contexts derive from ctx (BaseContext),\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"553\"\u003eso open event streams end as well.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k31\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"534\"\u003e7/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"534\"\u003eserve calls srv.Shutdown. ListenAndServe returns ErrServerClosed and sends it on errc. Nobody reads errc any more, but its one slot takes the value, so the\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"553\"\u003egoroutine finishes instead of leaking.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k32\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"534\"\u003e8/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"534\"\u003eShutdown returns once the open requests are done. serve returns and the process exits.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"508\" x2=\"1260\" y2=\"508\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"595\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"606\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"595\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"606\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"602\" x2=\"238.4\" y2=\"602\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"606\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"595\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"606\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"595\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"606\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"595\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003cte "v\" style=\"animation-name:k29\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e1/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eA crawler opens hard library puzzles; each page starts its solve in the background (section 8). Nobody waits for these, so each takes a background slot first, then\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"653\"\u003ea slot. Both are selects that also watch the solve's context, here one that never ends.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k30\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e2/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eThe second does the same. Now b.background is full: two of the three slots are taken by solves nobody waits for.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k31\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e3/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eThe third blocks on b.background. The rest of the crawl queues up here too, not in front of the pages.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k32\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e4/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eA player asks for a new puzzle. A page's solve needs only a slot, and the third is free: it solves at once.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k33\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e5/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eA second player pastes a puzzle. All three slots are taken, so its select blocks until a slot frees up or its request ends.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k34\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e6/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eVisitor 2 gives up and closes the tab. The select takes the context's case: the handler returns without having solved anything.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k35\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e7/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eVisitor 1 leaves too, while its puzzle is solved. Before its next lookahead trial the solver polls Done (solver.cancelled) and ends Cancelled; the deferred receive\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"653\"\u003efrees the slot.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k36\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e8/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eLibrary 1 is done. Its deferred receives free its slot, then its background slot, in reverse order. That releases library 3, which takes a slot next.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k37\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e9/9\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eLibrary 2 and 3 end the same way. The rest of the crawl follows, two at a time, and a page always finds the third slot.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"608\" x2=\"1260\" y2=\"608\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"706\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"706\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"702\" x2=\"238.4\" y2=\"702\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"706\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"706\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"695\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"706\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"695\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"706\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"702\" x2=\"641.2\" y2=\"702\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"706\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":1.1,"caption":"A crawler opens hard library puzzles; each page starts its solve in the background (section 8). Nobody waits for these, so each takes a background slot first, then a slot. Both are selects that also watch the solve's context, here one that never ends.","ops":["library 1 starts (once.Do: go)","library 1: select { b.background \u003c- {} | \u003c-ctx.Done() } → {} waits in the buffer of b.background","library 1: select { b.slots \u003c- {} | \u003c-ctx.Done() } → {} waits in the buffer of b.slots","library 1: solving"]},{"t0":9.93,"t1":11.03,"caption":"The second does the same. Now b.background is full: two of the three slots are taken by solves nobody waits for.","ops":["library 2 starts (once.Do: go)","library 2: select { b.background \u003c- {} | \u003c-ctx.Done() } → {} waits in the buffer of b.background","library 2: select { b.slots \u003c- {} | \u003c-ctx.Done() } → {} waits in the buffer of b.slots","library 2: solving"]},{"t0":15.69,"t1":16.79,"caption":"The third blocks on b.background. The rest of the crawl queues up here too, not in front of the pages.","ops":["library 3 starts (once.Do: go)","library 3: select { b.background \u003c- {} | \u003c-ctx.Done() } → blocks"]},{"t0":21.15,"t1":22.25,"caption":"A player asks for a new puzzle. A page's solve needs only a slot, and the third is free: it solves at once.","ops":["page: new puzzle starts (net/http: new request)","page: new puzzle: select { b.slots \u003c- {} | \u003c-ctx.Done() } → {} waits in the buffer of b.slots","page: new puzzle: solving"]},{"t0":26.76,"t1":27.86,"caption":"A second player pastes a puzzle. All three slots are taken, so its select blocks until a slot frees up or its request ends.","ops":["page: /play starts (net/http: new request)","page: /play: select { b.slots \u003c- {} | \u003c-ctx.Done() } → blocks"]},{"t0":32.85,"t1":33.95,"caption":"Visitor 2 gives up and closes the tab. The select takes the context's case: the handler returns without having solved anything.","ops":["visitor 2: close(ctx.Done()) → wakes page: /play","page: /play returns (returned: visitor left)"]},{"t0":39.06,"t1":40.16,"caption":"Visitor 1 leaves too, while its puzzle is solved. Before its next lookahead trial the solver polls Done (solver.cancelled) and ends Cancelled; the deferred receive frees the slot.","ops":["visitor 1: close(ctx.Done()), nobody waits on it","page: new puzzle: select { \u003c-ctx.Done() | default } → ctx.Done() is closed: ready at once","page: new puzzle: \u003c-b.slots → takes {} from the buffer","page: new puzzle returns (returned: visitor left)"]},{"t0":46.83,"t1":47.93,"caption":"Library 1 is done. Its deferred receives free its slot, then its background slot, in reverse order. That releases library 3, which takes a slot next.","ops":["library 1: \u003c-b.slots → takes {} from the buffer","library 1: \u003c-b.background → takes {} from the buffer; library 3's {} moves in, and it wakes up","library 1 returns (returned: result kept)","library 3: select { b.slots \u003c- {} | \u003c-ctx.Done() } → {} waits in the buffer of b.slots","library 3: solving"]},{"t0":53.7,"t1":54.8,"caption":"Library 2 and 3 end the same way. The rest of the crawl follows, two at a time, and a page always finds the third slot.","ops":["library 2: \u003c-b.slots → takes {} from the buffer","library 2: \u003c-b.background → takes {} from the
