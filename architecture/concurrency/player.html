cn2\" x=\"20\" y=\"554\"\u003e1/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eRunConcurrent starts one goroutine per observer with wg.Go. Each works on its own copy of the board, at version 0.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k57\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e2/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eThe runner is the only reader of out. It blocks until a message arrives.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k58\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e3/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eB finds marks first and sends them; the runner keeps them pending: A has a lower level and is not idle at v0 yet.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k59\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e4/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eA finds marks too. The lowest level goes first: the runner applies A's marks, version 1. B's pending marks are stale\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"573\"\u003enow and dropped.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k60\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e5/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eBroadcast: put appends batch v1 to each mailbox and does a non-blocking send on notify. The runner never blocks here.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k61\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e6/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eBoth observers wake up and take their whole queue. A is quick; B's rule is slow this time.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k62\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e7/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eA sends new marks. No simpler rule exists, so the runner applies them at once: version 2.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k63\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e8/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eBroadcast v2. A wakes up. B is busy, so its wake-up waits in the 1-slot buffer of notify.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k64\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e9/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eA catches up and finds more marks: version 3.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k65\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e10/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eBroadcast v3. B's notify slot is still full, so this wake-up is dropped; batch v3 is queued all the same.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k66\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e11/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eMeanwhile B reports marks from v1. The runner is busy, but out has room for one message per observer: B does not block.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k67\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e12/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eThe runner reads B's message from the buffer. Marks found on v1 are stale at v3 and ignored: B will deduce again.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k68\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e13/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eB's select finds the pending wake-up without blocking. take returns v2 and v3 together: one wake-up was enough.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k69\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e14/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eNeither finds anything new: both report idle at v3 and wait for the next broadcast.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k70\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e15/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eEvery observer is idle at the current version, so nothing is in flight. The deferred close(quit) wakes both at once;\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"573\"\u003ewg.Wait waits for them.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k71\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"554\"\u003e16/16\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"554\"\u003eThe observers return; wg counts down to 0 and wg.Wait returns. No goroutine outlives RunConcurrent.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"528\" x2=\"940\" y2=\"528\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"615\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"626\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"615\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"626\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"622\" x2=\"238.4\" y2=\"622\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"626\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"615\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"626\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"615\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"626\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"615\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"626\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"622\" x2=\"641.2\" y2=\"622\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"626\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"RunConcurrent starts one goroutine per observer with wg.Go. Each works on its own copy of the board, at version 0.","ops":["runner: wg.Go → observer A (level 1) starts, counter 1","runner: wg.Go → observer B (level 3) starts, counter 2","observer A (level 1): deduces on v0","observer B (level 3): deduces on v0"]},{"t0":5.07,"t1":5.42,"caption":"The runner is the only reader of out. It blocks until a message arrives.","ops":["runner: \u003c-out → blocks"]},{"t0":8.88,"t1":9.98,"caption":"B finds marks first and sends them; the runner keeps them pending: A has a lower level and is not idle at v0 yet.","ops":["observer B (level 3): select { out \u003c- marks@v0 | \u003c-quit } → hands marks@v0 to runner, who wakes up","runner: runner state: version 0, pending: B marks@v0, idle: –","runner: \u003c-out → blocks","observer B (level 3): select { \u003c-notify | \u003c-quit } → blocks"]},{"t0":14.67,"t1":15.77,"caption":"A finds marks too. The lowest level goes first: the runner applies A's marks, version 1. B's pending marks are stale now and dropped.","ops":["observer A (level 1): select { out \u003c- marks@v0 | \u003c-quit } → hands marks@v0 to runner, who wakes up","runner: runner state: version 1, pending: – (B's dropped), idle: –","observer A (level 1): select { \u003c-notify | \u003c-quit } → blocks"]},{"t0":21.06,"t1":22.16,"caption":"Broadcast: put appends batch v1 to each mailbox and does a non-blocking send on notify. The runner never blocks here.","ops":["runner: boxes[id].put(v1) → mailbox A (mutex + slice): queue: v1","runner: select { notify \u003c- wake | default } → h x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eres 11\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k73\"\u003e\u003crect class=\"tk\" x=\"-30.1\" y=\"-10\" width=\"60.2\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eseed 13\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k74\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eres 10\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k75\"\u003e\u003crect class=\"tk\" x=\"-30.1\" y=\"-10\" width=\"60.2\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eseed 14\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k76\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eres 12\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k77\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k78\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k79\"\u003e\u003crect class=\"tk\" x=\"-33.4\" y=\"-10\" width=\"66.8\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eres 13 ✗\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k80\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k81\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k56\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e1/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eSearch makes two unbuffered channels and starts two workers with wg.Go. Each ranges over jobs and blocks: nothing is sent yet.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k57\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e2/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eIt starts a producer and a closer, which waits for the workers. The caller itself ranges over results.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k58\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e3/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eUnbuffered means every send is a handoff to a waiting receiver: seed 10 goes to worker 1, seed 11 to worker 2.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k59\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e4/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eNo worker is free, so the producer blocks in its select until one takes seed 12 or the context is cancelled.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k60\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e5/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 2 finishes first. Seed 11 is out of order: the caller keeps it in the reorder buffer.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k61\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e6/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 2 asks for the next seed: the producer's waiting send completes. It offers seed 13 and blocks again.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k62\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e7/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 1 delivers seed 10. Now 10 and 11 are in sequence: the caller emits both, from one goroutine, and writes their files.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k63\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e8/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eWorker 2 finishes seed 12 while the caller is still writing. Its send must wait: back-pressure through the unbuffered channel.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k64\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e9/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eCtrl-C cancels the context: ctx.Done() is closed. The producer's select wakes up and returns; its deferred close(jobs)\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"533\"\u003efollows.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k65\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e10/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe caller takes seed 12 and emits it. Worker 2's range over the closed jobs ends: it returns, wg counts down.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k66\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e11/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eSeed 13 comes back with an error because it was cancelled. The caller drops it: a gap where the run ends.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k67\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e12/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eThe last worker is gone, so wg.Wait returns and the closer closes results. That ends the caller's range loop.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k68\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"514\"\u003e13/13\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"514\"\u003eSearch returns 13, the first seed not emitted: -from 13 continues the run without holes.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"488\" x2=\"990\" y2=\"488\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"586\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"586\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"582\" x2=\"238.4\" y2=\"582\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"586\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"575\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"586\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"575\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"586\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"575\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"586\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"582\" x2=\"641.2\" y2=\"582\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"586\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"Search makes two unbuffered channels and starts two workers with wg.Go. Each ranges over jobs and blocks: nothing is sent yet.","ops":["caller: wg.Go → worker 1 starts, counter 1","caller: wg.Go → worker 2 starts, counter 2","worker 1: range jobs → block 3e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"t\" style=\"animation-name:k40\"\u003e\u003crect class=\"tk\" x=\"-26.8\" y=\"-10\" width=\"53.6\" height=\"20\" rx=\"10\"/\u003e\u003ctext class=\"tl m\" y=\"4\"\u003eclosed\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k30\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e1/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eVisitor 1 opens a library puzzle (page #1). Building the page, done() peeks at e.ready with a select with default: it\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"653\"\u003enever blocks.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k31\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e2/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eThen lib.start calls once.Do. The first call starts the solver goroutine, whose defer close(e.ready) is the promise.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k32\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e3/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eLater the page asks /bibliothek/weg for the trace (/weg #1). once.Do does nothing now; the handler waits on e.ready or\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"653\"\u003eits request.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k33\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e4/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eA second visitor asks too (/weg #2). Any number of goroutines can wait on the same channel.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k34\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e5/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eVisitor 1 closes the tab, which cancels their request: that handler returns. The solver goes on for whoever comes next.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k35\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e6/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eThe solver sets sol, res and err, then its deferred close(e.ready) wakes every waiter at once.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k36\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e7/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eWhat was written before the close is safe to read after the receive: no lock needed for e.res.\u003c/text\u003e\u003c/g\u003e\n\u003cg class=\"v\" style=\"animation-name:k37\"\u003e\u003ctext class=\"cn2\" x=\"20\" y=\"634\"\u003e8/8\u003c/text\u003e\u003ctext class=\"cp\" x=\"64\" y=\"634\"\u003eA closed channel stays ready forever: for visitor 3 (page #3), done() is true at once and the page carries the trace.\u003c/text\u003e\u003c/g\u003e\n\u003cline class=\"sep\" x1=\"20\" y1=\"608\" x2=\"960\" y2=\"608\"/\u003e\u003crect class=\"g run\" x=\"20\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"48\" y=\"706\" font-size=\"12\"\u003erunning\u003c/text\u003e\u003crect class=\"g blk\" x=\"116.2\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"144.2\" y=\"706\" font-size=\"12\"\u003eblocked\u003c/text\u003e\u003cline class=\"wt\" x1=\"212.4\" y1=\"702\" x2=\"238.4\" y2=\"702\" marker-end=\"url(#aw)\"/\u003e\u003ctext class=\"mu\" x=\"246.4\" y=\"706\" font-size=\"12\"\u003ewaits on\u003c/text\u003e\u003crect class=\"g ext\" x=\"321.2\" y=\"695\" width=\"22\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"349.2\" y=\"706\" font-size=\"12\"\u003ereturned\u003c/text\u003e\u003crect class=\"ch\" x=\"424\" y=\"695\" width=\"30\" height=\"14\" rx=\"3\"/\u003e\u003ctext class=\"mu\" x=\"460\" y=\"706\" font-size=\"12\"\u003echannel\u003c/text\u003e\u003crect class=\"tk\" x=\"528.2\" y=\"695\" width=\"26\" height=\"14\" rx=\"7\"/\u003e\u003ctext class=\"mu\" x=\"560.2\" y=\"706\" font-size=\"12\"\u003evalue\u003c/text\u003e\u003cline class=\"fl\" x1=\"615.2\" y1=\"702\" x2=\"641.2\" y2=\"702\" marker-end=\"url(#af)\"/\u003e\u003ctext class=\"mu\" x=\"649.2\" y=\"706\" font-size=\"12\"\u003edata flow\u003c/text\u003e\n\u003c/svg\u003e\n","steps":[{"t0":0,"t1":0.35,"caption":"Visitor 1 opens a library puzzle (page #1). Building the page, done() peeks at e.ready with a select with default: it never blocks.","ops":["page #1 starts (net/http: new request)","page #1: select { \u003c-e.ready | default } → default: not ready"]},{"t0":5.58,"t1":5.93,"caption":"Then lib.start calls once.Do. The first call starts the solver goroutine, whose defer close(e.ready) is the promise.","ops":["page #1: e.once.Do → first call, runs the function","page #1: once.Do: go → solver starts","solver: bruteforce, then solve","page #1 returns (page sent, no trace yet)"]},{"t0":10.71,"t1":11.06,"caption":"Later the page asks /bibliothek/weg for the trace (/weg #1). once.Do does nothing now; the handler waits on e.ready or its request.","ops":["/weg #1 starts (net/http: new request)","/weg #1: e.once.Do → already done, does nothing","/weg #1: select { \u003c-e.ready | \u003c-r.Context().Done() } → blocks"]},{"t0":16.29,"t1":16.64,"caption":"A second visitor asks too (/weg #2). Any number of goroutines can wait on the same channel.","ops":["/weg #2 starts (net/http: new request)","/weg #2: e.once.Do → already done, does nothing","/weg #2: select { \u003c-e.ready | \u003c-r.Context().Done() } → blocks"]},{"t0":20.67,"t1":21.77,"caption":"Visitor 1 closes the tab, which cancels their request: that handler returns. The solver goes on for whoever comes next.","ops":["visitor 1: close(r.Context().Done()) → wakes /weg #1","/weg #1 returns (returned: visitor left)"]},{"t0":26.64,"t1":27.74,"caption":"The solver sets sol, res and err, then its deferred close(e.ready) wakes every waiter at once.","ops":["solver: close(e.ready) → wakes /weg #2","solver returns (returned)"]},{"t0":31.86,"t1":32.21,"caption":"What was written before the close is safe to read after the receive: no lock needed for e.res.","ops":["/weg #2: reads e.res, sends JSON","/weg #2 returns (returned)"]},{"t0":36.33,"t1":37.43,"caption":"A closed channel stays ready forever: for visitor 3 (page #3), done() is true at once and the page carries the trace.","ops":["page #3 starts (net/http: new request)","page #3: select { \u003c-e.ready | default } → e.ready is closed: ready at once","page #3: e.once.Do → already done, does nothing","page #3 returns (page sent with trace)"]}]}]</script>
<script>
"use strict";
const stories = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const root = $("scene").attachShadow({ mode: "open" });
let story, anims = [], playing = false, stopAt = null, raf = 0;

const now = () => (anims.length ? (anims[0].currentTime || 0) / 1000 : 0);
const stepAt = (t) => {
  let i = 0;
  while (i + 1 < story.steps.length && story.steps[i + 1].t0 <= t + 1e-6) i++;
  return i;
};
// The moment step i has played out: values arrived, states changed. The
// last step plays out at the end of the timeline.
const settled = (i) => {
  if (i + 1 >= story.steps.length) return story.total;
  return Math.min(story.steps[i].t1 + 0.4, story.steps[i + 1].t0 - 0.01);
};

function seek(t) {
  t = Math.max(0, Math.min(t, story.total - 0.001));
  for (const a of anims) a.currentTime = t * 1000;
  show();
}
function pause() {
  for (const a of anims) a.pause();
  playing = false;
  stopAt = null;
  show();
}
function play(until) {
  if (until == null && now() >= story.total - 0.05) seek(0);
  for (const a of anims) a.play();
  playing = true;
  stopAt = until ?? null;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(function tick() {
    if (!playing) return;
    if (stopAt != null && now() >= stopAt) {
      seek(stopAt);
      pause();
      return;
    }
    if (now() >= story.total) {
      seek(story.total - 0.001);
      pause();
      return;
    }
    show();
    raf = requestAnimationFrame(tick);
  });
}
// Plays step i from its start until it has played out.
function playStep(i) {
  seek(story.steps[i].t0);
  play(settled(i));
}
function next() {
  const i = stepAt(now());
  if (!playing && now() < settled(i) - 0.05) return playStep(i);
  if (i + 1 < story.steps.length) playStep(i + 1);
}
function prev() {
  pause();
  const i = stepAt(now());
  seek(settled(Math.max(0, now() > settled(i) + 0.05 ? i : i - 1)));
}

// reveal scrolls the step list, and only the list, so that li is in view.
function reveal(li) {
  const ol = $("steps"), b = ol.getBoundingClientRect(), r = li.getBoundingClientRect();
  if (r.top < b.top) ol.scrollTop -= b.top - r.top;
  else if (r.bottom > b.bottom) ol.scrollTop += Math.min(r.bottom - b.bottom, r.top - b.top);
}

let shown = -1;
function show() {
  const t = now();
  $("scrub").value = Math.round((t / story.total) * 1000);
  $("clock").textContent = `${t.toFixed(1)} / ${story.total.toFixed(1)} s`;
  $("play").textContent = playing ? "❚❚ Pause" : "▶ Play";
  const i = stepAt(t);
  if (i !== shown) {
    shown = i;
    [...$("steps").children].forEach((li, k) => {
      li.classList.toggle("cur", k === i);
      if (k === i) reveal(li);
    });
    $("where").textContent = `Step ${i + 1} of ${story.steps.length}`;
  }
}

function load(id) {
  if (story) pause();
  story = stories.find((s) => s.id === id) || stories[0];
  // Page styles do not reach into the shadow root: the scene gets its own.
  // As wide as the column, as high as the window allows with the controls
  // still in view; the drawing is centred in whatever remains.
  root.innerHTML = "<style>svg{display:block;width:100%;height:auto;max-height:calc(100vh - 170px)}</style>" + story.svg;
  anims = root.getAnimations();
  for (const a of anims) {
    a.pause();
    a.playbackRate = +$("speed").value;
  }
  const ol = $("steps");
  ol.textContent = "";
  story.steps.forEach((st, k) => {
    const li = document.createElement("li");
    li.textContent = st.caption;
    const ops = document.createElement("div");
    ops.className = "ops";
    ops.textContent = st.ops.join("\n");
    li.append(ops);
    li.onclick = () => playStep(k);
    ol.append(li);
  });
  for (const b of $("tabs").children) b.setAttribute("aria-pressed", b.dataset.id === story.id);
  document.title = story.title;
  shown = -1;
  seek(0);
}

for (const s of stories) {
  const b = document.createElement("button");
  b.textContent = s.title.replace(/:.*/, "");
  b.title = s.title;
  b.dataset.id = s.id;
  b.onclick = () => (location.hash = s.id);
  $("tabs").append(b, " ");
}
$("play").onclick = () => (playing ? pause() : play());
$("next").onclick = next;
$("prev").onclick = prev;
$("scrub").oninput = (e) => {
  pause();
  seek((e.target.value / 1000) * story.total);
};
$("speed").onchange = (e) => {
  for (const a of anims) a.playbackRate = +e.target.value;
};
addEventListener("keydown", (e) => {
  if (e.target.closest("input,select") || (e.key === " " && e.target.closest("button"))) return;
  if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === " ") playing ? pause() : play();
  else return;
  e.preventDefault();
});
addEventListener("hashchange", () => load(location.hash.slice(1)));
load(location.hash.slice(1));
</script>
</body>
</html>
